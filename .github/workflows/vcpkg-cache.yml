name: Update vcpkg cache

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: vcpkg-cache

jobs:
  vcpkg:
    name: Cache
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: vcpkg install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/vcpkg-install.sh
